<!doctype html>
<html lang="en" data-theme="dark" data-auth-pending>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>चैतन्य / Codex Map Beta</title>
  <script>
    const localPreview = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
    window.__codexPrivatePromise = localPreview
      ? Promise.resolve({ ok:true, payload:null })
      : fetch("/api/consciousness-private", {
          credentials:"same-origin",
          cache:"no-store"
        }).then(async response => {
          if (!response.ok) {
            location.replace("/consciousness/");
            throw new Error("Private layer unavailable");
          }
          return response.json();
        }).catch(error => {
          if (!location.pathname.startsWith("/consciousness")) location.replace("/consciousness/");
          throw error;
        });
  </script>
  <style>
    :root {
      --paper:#f1f1ed;
      --ink:#111315;
      --muted:#666b6c;
      --hair:rgba(17,19,21,.16);
      --panel:rgba(241,241,237,.82);
      --signal:#22b86a;
      --signal-hot:#8cffb7;
      --mono:"IBM Plex Mono","Cascadia Mono","SFMono-Regular",Consolas,monospace;
      --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
    }
    :root[data-theme="dark"] {
      --paper:#060708;
      --ink:#eef0eb;
      --muted:#858c8d;
      --hair:rgba(238,240,235,.14);
      --panel:rgba(6,7,8,.78);
      --signal:#36df80;
      --signal-hot:#a3ffc3;
    }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    html[data-auth-pending] body { visibility:hidden; }
    body {
      background:var(--paper);
      color:var(--ink);
      font-family:var(--sans);
      transition:background-color .24s ease,color .24s ease;
    }
    button,a { color:inherit; font:inherit; }
    .brain-shell { position:relative; width:100%; height:100svh; isolation:isolate; overflow:hidden; }
    .brain-header {
      position:absolute;
      z-index:100;
      top:0;
      left:0;
      right:0;
      height:62px;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      padding:0 clamp(18px,3vw,48px);
      pointer-events:none;
    }
    .brain-brand {
      margin:0;
      font:500 11px/1 var(--mono);
      letter-spacing:.16em;
      text-transform:uppercase;
      pointer-events:auto;
    }
    .mode-link,.theme-toggle {
      width:44px;
      height:44px;
      display:grid;
      place-items:center;
      padding:0;
      border:0;
      background:none;
      cursor:pointer;
      pointer-events:auto;
      text-decoration:none;
    }
    .mode-link { justify-self:center; }
    .mode-link::before,.theme-toggle::before {
      content:"";
      width:20px;
      height:20px;
      border:2px solid var(--ink);
      border-radius:50%;
      transition:transform .18s ease,background-color .2s ease,box-shadow .2s ease;
    }
    .mode-link::before { box-shadow:inset 0 0 0 5px var(--paper); background:var(--ink); }
    .theme-toggle { justify-self:end; }
    :root[data-theme="dark"] .theme-toggle::before {
      background:var(--ink);
      box-shadow:inset 7px 0 0 var(--paper);
    }
    .mode-link:hover::before,.theme-toggle:hover::before,
    .mode-link:focus-visible::before,.theme-toggle:focus-visible::before { transform:scale(1.14); }
    .mode-link:focus-visible,.theme-toggle:focus-visible { outline:1px solid var(--signal); outline-offset:-3px; }
    .brain-stage { position:absolute; inset:0; overflow:hidden; background:var(--paper); }
    .brain-stage::after {
      content:"";
      position:absolute;
      inset:0;
      z-index:3;
      pointer-events:none;
      background:radial-gradient(ellipse at 50% 49%,transparent 12%,color-mix(in srgb,var(--paper) 5%,transparent) 60%,color-mix(in srgb,var(--paper) 30%,transparent));
    }
    .brain-canvas {
      position:absolute;
      z-index:1;
      inset:0;
      display:block;
      width:100%;
      height:100%;
      touch-action:none;
      cursor:grab;
    }
    .brain-canvas:active { cursor:grabbing; }
    .marker-layer { position:absolute; z-index:4; inset:0; pointer-events:none; }
    .brain-marker {
      position:absolute;
      left:0;
      top:0;
      width:12px;
      height:12px;
      margin:-6px 0 0 -6px;
      padding:0;
      border:0;
      background:none;
      pointer-events:auto;
      cursor:pointer;
      transform-origin:center;
      transition:opacity .12s linear;
    }
    .brain-marker i {
      position:absolute;
      inset:3px;
      display:block;
      border:1px solid color-mix(in srgb,var(--ink) 56%,transparent);
      background:var(--paper);
      transform:rotate(45deg);
      transition:transform .16s ease,background-color .16s ease,box-shadow .16s ease;
    }
    .brain-marker span {
      position:absolute;
      left:13px;
      top:50%;
      width:max-content;
      max-width:150px;
      overflow:hidden;
      color:var(--muted);
      font:500 8px/1 var(--mono);
      letter-spacing:.09em;
      text-overflow:ellipsis;
      text-transform:uppercase;
      white-space:nowrap;
      opacity:.18;
      transform:translateY(-50%);
      transition:opacity .16s ease,color .16s ease;
    }
    .brain-marker:hover i,.brain-marker:focus-visible i,.brain-marker.is-active i {
      background:var(--ink);
      transform:rotate(45deg) scale(1.55);
    }
    .brain-marker:hover span,.brain-marker:focus-visible span,.brain-marker.is-active span { opacity:1; color:var(--ink); }
    .brain-marker:focus-visible { outline:0; }
    .brain-marker.is-private i {
      border-color:var(--signal-hot);
      background:var(--signal);
      box-shadow:0 0 8px var(--signal),0 0 22px color-mix(in srgb,var(--signal) 72%,transparent),0 0 42px color-mix(in srgb,var(--signal) 36%,transparent);
    }
    .brain-marker.is-private span { color:var(--signal-hot); opacity:.72; text-shadow:0 0 12px var(--signal); }
    .brain-detail {
      position:absolute;
      z-index:8;
      left:clamp(18px,3vw,48px);
      bottom:clamp(18px,3vw,42px);
      width:min(410px,calc(100vw - 36px));
      padding:14px 16px 16px;
      border-top:1px solid var(--hair);
      background:linear-gradient(90deg,var(--panel),transparent);
      backdrop-filter:blur(10px);
      pointer-events:none;
    }
    .detail-meta,.detail-summary,.brain-mark { font-family:var(--mono); }
    .detail-meta { margin:0 0 8px; color:var(--signal); font-size:8px; letter-spacing:.14em; text-transform:uppercase; }
    .detail-title { margin:0 0 8px; font:500 clamp(22px,3vw,38px)/.95 var(--mono); letter-spacing:-.06em; text-transform:uppercase; }
    .detail-summary { margin:0; max-width:58ch; color:var(--muted); font-size:10px; line-height:1.55; }
    .brain-mark {
      position:absolute;
      z-index:8;
      right:clamp(18px,3vw,48px);
      bottom:clamp(18px,3vw,42px);
      margin:0;
      color:var(--muted);
      font-size:8px;
      letter-spacing:.12em;
      text-transform:uppercase;
      writing-mode:vertical-rl;
    }
    .brain-fallback {
      position:absolute;
      z-index:20;
      inset:0;
      display:none;
      place-items:center;
      padding:30px;
      color:var(--muted);
      font:10px/1.6 var(--mono);
      text-align:center;
    }
    .brain-fallback.visible { display:grid; }
    @media (max-width:760px) {
      .brain-header { height:54px; padding-inline:14px; }
      .brain-brand { font-size:8px; }
      .brain-detail { left:12px; right:12px; bottom:12px; width:auto; padding:11px 12px 13px; }
      .detail-title { font-size:22px; }
      .detail-summary { display:-webkit-box; overflow:hidden; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
      .brain-mark { display:none; }
      .brain-marker span { max-width:92px; font-size:7px; opacity:.1; }
      .brain-marker.is-private span { opacity:.66; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation:none!important; transition-duration:.01ms!important; }
    }
  </style>
</head>
<body>
  <main class="brain-shell">
    <header class="brain-header">
      <p class="brain-brand"><span lang="hi">चैतन्य</span> / Codex Map <sup>β</sup></p>
      <a class="mode-link" href="../consciousness/" aria-label="Return to Cloud Consciousness"></a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode"></button>
    </header>
    <section class="brain-stage" id="brain-stage" aria-label="Interactive artistic brain association">
      <canvas class="brain-canvas" id="brain-canvas"></canvas>
      <div class="marker-layer" id="marker-layer"></div>
      <aside class="brain-detail" aria-live="polite">
        <p class="detail-meta" id="detail-meta">Belief / associative drawer</p>
        <h1 class="detail-title" id="detail-title">Agency</h1>
        <p class="detail-summary" id="detail-summary"></p>
      </aside>
      <p class="brain-mark">Associative layer / not anatomy</p>
      <p class="brain-fallback" id="brain-fallback">This layer needs WebGL.</p>
    </section>
  </main>
  <script type="module">
    import { publicNodes, typeMeta } from "../consciousness/graph-data.js";
    import { NODE_REGION } from "../consciousness/brain/brain-mapping.js";
    import { REGIONS } from "../consciousness/brain/brain-regions.js";
    import { mountBrainNet } from "./brain-net.js";

    const auth = await window.__codexPrivatePromise;
    delete document.documentElement.dataset.authPending;
    const privatePayload = auth?.payload;
    const privateNodes = Array.isArray(privatePayload?.nodes) ? privatePayload.nodes : [];
    const nodes = [
      ...publicNodes.filter(node => !node.id.startsWith("locked-")),
      ...privateNodes
    ];
    const nodeById = new Map(nodes.map(node => [node.id, node]));
    const regionById = new Map(REGIONS.map(region => [region.id, region]));
    const themeToggle = document.querySelector("#theme-toggle");
    const detailMeta = document.querySelector("#detail-meta");
    const detailTitle = document.querySelector("#detail-title");
    const detailSummary = document.querySelector("#detail-summary");

    function setTheme(theme) {
      const next = theme === "light" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      themeToggle.setAttribute("aria-label", `Switch to ${next === "dark" ? "light" : "dark"} mode`);
      try { localStorage.setItem("consciousness-brain-theme", next); } catch {}
      renderer?.redraw();
    }

    function selectNode(nodeId) {
      const node = nodeById.get(nodeId);
      if (!node) return;
      document.querySelectorAll(".brain-marker").forEach(marker => {
        marker.classList.toggle("is-active", marker.dataset.nodeId === nodeId);
      });
      const mapping = NODE_REGION[nodeId];
      const region = regionById.get(mapping?.region);
      detailMeta.textContent = `${typeMeta[node.type]?.label || node.type} / ${region?.label || "unfiled"} drawer`;
      detailTitle.textContent = node.label;
      detailSummary.textContent = node.summary || "";
    }

    let savedTheme = "dark";
    try { savedTheme = localStorage.getItem("consciousness-brain-theme") || "dark"; } catch {}
    let renderer = null;
    setTheme(savedTheme);
    themeToggle.addEventListener("click", () => {
      setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    });

    try {
      renderer = mountBrainNet(document.querySelector("#brain-canvas"), {
        nodes,
        markerLayer:document.querySelector("#marker-layer"),
        onSelect:selectNode,
        isPrivate:node => node.privacy !== "public"
      });
      selectNode(nodes.find(node => node.id === "agency")?.id || nodes[0]?.id);
    } catch (error) {
      console.error(error);
      document.querySelector("#brain-fallback").classList.add("visible");
    }
  </script>
</body>
</html>
