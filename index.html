<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>beingchay</title>
    <meta name="description" content="The constellation behind Chay: fallout, ANRXYST, C2X, and the consciousness at the centre.">
    <link rel="stylesheet" href="home.css">
  </head>
  <body>
    <main class="constellation" aria-labelledby="home-title">
      <h1 id="home-title" class="visually-hidden">beingchay</h1>

      <div class="star" aria-hidden="true">
        <span class="star-bloom"></span>
        <span class="star-core"></span>
        <span class="star-spikes"></span>
        <span class="star-flare"></span>
      </div>

      <div class="node-sky" aria-label="Constellation of concepts"></div>

      <div class="top-rail">
        <button class="deep-toggle" type="button" role="switch" aria-checked="false" aria-pressed="false" aria-label="Deep dive into the psyche">
          <span class="deep-track" aria-hidden="true"><span class="deep-knob"></span></span>
        </button>
      </div>

      <button class="audio-toggle" type="button" aria-pressed="false" aria-label="Toggle ambient sound" title="Sound">
        <span class="audio-icon" aria-hidden="true"></span>
      </button>

      <div class="open-prompt" role="dialog" aria-modal="true" aria-labelledby="open-prompt-title" hidden>
        <div class="open-prompt-card">
          <p class="open-prompt-kicker">Node selected</p>
          <p class="open-prompt-title" id="open-prompt-title">
            Open Cloud Consciousness?
          </p>
          <p class="open-prompt-meta">
            <span class="open-prompt-node"></span> lives inside the map, with its
            evidence, relations and contradictions.
          </p>
          <div class="open-prompt-actions">
            <button class="open-prompt-cancel" type="button">Stay here</button>
            <button class="open-prompt-confirm" type="button">Open</button>
          </div>
        </div>
      </div>

      <canvas class="warp-field" aria-hidden="true"></canvas>
      <div class="departure-flare" aria-hidden="true"></div>
    </main>

    <audio class="bg-music" src="assets/smoke-state-1.mp3" loop preload="none"></audio>
    <script type="module" src="home.js"></script>
  </body>
</html>
