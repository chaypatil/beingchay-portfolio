<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Brain Vault — beingchay</title>
  <style>
    :root { --paper:#efeee8; --ink:#0a0a0a; --grid:#d6d4cd; --green:#145f37; --muted:#66645e; }
    * { box-sizing:border-box; }
    html { background:var(--paper); color:var(--ink); font-family:"Courier New",monospace; }
    body { margin:0; min-height:100vh; background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:18px 18px; }
    button,input { font:inherit; }
    .top { position:sticky; top:0; z-index:4; display:grid; grid-template-columns:auto 1fr auto; gap:20px; align-items:center; min-height:68px; padding:12px 22px; border-bottom:1px solid var(--ink); background:color-mix(in srgb,var(--paper) 94%,transparent); backdrop-filter:blur(12px); }
    .back { color:inherit; text-decoration:none; font-size:12px; text-transform:uppercase; }
    .title { margin:0; font:700 clamp(18px,3vw,36px)/.9 Georgia,serif; text-transform:uppercase; }
    .counts { text-align:right; font-size:10px; text-transform:uppercase; line-height:1.5; }
    .tools { display:grid; grid-template-columns:minmax(180px,1fr) auto; gap:8px; width:min(760px,calc(100% - 32px)); margin:22px auto 10px; }
    .search { width:100%; padding:12px 14px; border:1px solid var(--ink); border-radius:0; background:var(--paper); color:var(--ink); }
    .filter { border:1px solid var(--ink); background:var(--ink); color:var(--paper); padding:0 15px; cursor:pointer; }
    .context { width:min(760px,calc(100% - 32px)); margin:0 auto 18px; padding:10px 12px; border-left:3px solid var(--green); background:var(--paper); font-size:11px; line-height:1.5; }
    .vault { width:min(960px,calc(100% - 32px)); margin:0 auto 80px; display:grid; gap:10px; }
    .record { border:1px solid var(--ink); background:var(--paper); box-shadow:4px 4px 0 color-mix(in srgb,var(--green) 35%,transparent); }
    .record summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:58px minmax(0,1fr) auto; gap:12px; align-items:center; padding:14px; }
    .record summary::-webkit-details-marker { display:none; }
    .record-index,.record-meta { color:var(--muted); font-size:9px; text-transform:uppercase; }
    .record-title { overflow:hidden; text-overflow:ellipsis; font-size:12px; text-transform:uppercase; }
    .record[open] summary { background:var(--ink); color:var(--paper); }
    .record-body { margin:0; max-height:66vh; overflow:auto; padding:18px; border-top:1px solid var(--ink); white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.65 "Courier New",monospace; }
    .record.is-private { background:#0a0a0a; color:#efeee8; box-shadow:4px 4px 0 #30302d; }
    .record.is-private .record-title { display:inline-block; width:min(220px,44vw); color:transparent; background:#efeee8; }
    .record.is-private .record-body { border-color:#efeee8; }
    .empty { padding:70px 20px; text-align:center; text-transform:uppercase; font-size:11px; }
    @media (max-width:640px) {
      .top { grid-template-columns:auto 1fr; padding:10px 14px; min-height:58px; }
      .counts { display:none; }
      .tools { grid-template-columns:1fr; }
      .filter { min-height:42px; }
      .record summary { grid-template-columns:38px minmax(0,1fr); }
      .record-meta { grid-column:2; }
      .record-body { font-size:11px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="back" href="/consciousness/">← consciousness</a>
    <h1 class="title">Brain Vault</h1>
    <div class="counts" id="counts">loading archive…</div>
  </header>
  <div class="tools">
    <input class="search" id="search" type="search" placeholder="search notes, topics, sessions…" autocomplete="off">
    <button class="filter" id="privacy-filter" type="button" aria-pressed="false">show redacted / on</button>
  </div>
  <p class="context" id="context">The full notebook structure is public. Black records are real private layers whose source text never enters the public repository.</p>
  <main class="vault" id="vault" aria-live="polite"></main>
  <script type="module" src="./vault.js"></script>
</body>
</html>
